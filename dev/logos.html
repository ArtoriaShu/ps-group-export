<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo 方案对比</title>
<style>
:root { --bg:#24262a; --surface:#2d3035; --line:#41454d; --text:#f1f2f4; --muted:#a5aab4; --accent:#a7c7ff; --accent-bg:#294369; }
body { margin:0; background:#191b1e; color:var(--muted); font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; padding:20px 16px 40px; }
h1 { color:var(--text); font-size:16px; margin:0 0 4px; text-align:center; }
.lead { text-align:center; margin:0 0 20px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; max-width:1040px; margin:0 auto; }
.card { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:14px; }
.card h2 { margin:0 0 2px; font-size:13px; color:var(--text); }
.card p { margin:0 0 12px; font-size:11px; min-height:34px; }
.big { display:grid; place-items:center; height:96px; background:var(--surface); border-radius:8px; margin-bottom:10px; }
.big svg { width:72px; height:72px; }
.bar { display:flex; align-items:center; gap:8px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; }
.bar svg { width:24px; height:24px; flex-shrink:0; }
.bar strong { color:var(--text); font-size:13px; font-weight:600; }
.bar span { margin-left:auto; font-size:10px; }
</style>
</head>
<body>
<h1>Logo 方案对比</h1>
<p class="lead">每个方案上面是放大 3 倍，下面是面板顶部的实际大小（24px）。</p>
<div class="grid" id="grid"></div>
<script>
// Each logo is a 24×24 SVG using the panel's own colours.
var A = 'var(--accent)', BG = 'var(--accent-bg)', DARK = '#24262a', SERIF = 'Georgia,Times New Roman,serif';
var logos = [
  ['A · 叠层 S（当前）', '斜体衬线 S，后面错开一层描边方块，像两层图层。',
   '<rect x="6.5" y="0.75" width="16.75" height="16.75" rx="4.5" fill="none" stroke="' + A + '" stroke-opacity=".35" stroke-width="1.5"/>' +
   '<rect x="0" y="6" width="18" height="18" rx="5" fill="' + BG + '"/>' +
   '<text x="9" y="19.6" text-anchor="middle" font-family="' + SERIF + '" font-style="italic" font-weight="700" font-size="13" fill="' + A + '">S</text>'],
  ['B · 图层组文件夹', 'Photoshop 里图层组就是文件夹图标，S 写在文件夹上。',
   '<path d="M1.5 6a2 2 0 0 1 2-2h5.2l2.1 2.3h9.7a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H3.5a2 2 0 0 1-2-2z" fill="' + BG + '" stroke="' + A + '" stroke-opacity=".55" stroke-width="1"/>' +
   '<text x="12" y="17.8" text-anchor="middle" font-family="' + SERIF + '" font-style="italic" font-weight="700" font-size="11" fill="' + A + '">S</text>'],
  ['C · 印章', '像落款的印章：外框加实心内章，S 反白。中式落款的感觉。',
   '<rect x="1.25" y="1.25" width="21.5" height="21.5" rx="3.5" fill="none" stroke="' + A + '" stroke-width="1.5"/>' +
   '<rect x="4.5" y="4.5" width="15" height="15" rx="1.5" fill="' + A + '"/>' +
   '<text x="12" y="16.6" text-anchor="middle" font-family="' + SERIF + '" font-weight="700" font-size="12.5" fill="' + DARK + '">S</text>'],
  ['D · 几何 S', '用圆角线条画出的 S，干净现代，小尺寸也清楚。',
   '<rect x="0" y="0" width="24" height="24" rx="6" fill="' + BG + '"/>' +
   '<path d="M16.6 6.4H10a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H7.4" fill="none" stroke="' + A + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'],
  ['E · 几何 S + 叠层', 'D 的线条 S，再加一层错开的方块表示图层。',
   '<rect x="6.5" y="0.75" width="16.75" height="16.75" rx="4.5" fill="none" stroke="' + A + '" stroke-opacity=".35" stroke-width="1.5"/>' +
   '<rect x="0" y="6" width="18" height="18" rx="5" fill="' + BG + '"/>' +
   '<path d="M12.6 10.6H7.6a2.3 2.3 0 0 0 0 4.6h2.8a2.3 2.3 0 0 1 0 4.6H5.4" fill="none" stroke="' + A + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'],
  ['F · shu 字标', '直接写小写 shu，最直白，名字一眼可见。',
   '<rect x="0" y="0" width="24" height="24" rx="6" fill="' + BG + '"/>' +
   '<text x="12" y="15.2" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-weight="700" font-size="8.6" letter-spacing=".2" fill="' + A + '">shu</text>'],
  ['G · 层叠平面', '三层斜放的图层平面，最上层带 S。图形感最强，但 S 很小。',
   '<path d="M12 14.6 21 18.9 12 23.2 3 18.9z" fill="none" stroke="' + A + '" stroke-opacity=".35" stroke-width="1.2" stroke-linejoin="round"/>' +
   '<path d="M12 9.8 21 14.1 12 18.4 3 14.1z" fill="none" stroke="' + A + '" stroke-opacity=".6" stroke-width="1.2" stroke-linejoin="round"/>' +
   '<path d="M12 1 21 5.3 12 9.6 3 5.3z" fill="' + BG + '" stroke="' + A + '" stroke-width="1.2" stroke-linejoin="round"/>' +
   '<text x="12" y="7.5" text-anchor="middle" font-family="' + SERIF + '" font-style="italic" font-weight="700" font-size="6" fill="' + A + '">S</text>'],
  ['H · 圆章签名', '圆形底加斜体 S，下方一道短横像签名的收笔。',
   '<circle cx="12" cy="12" r="11.5" fill="' + BG + '"/>' +
   '<text x="12" y="15.8" text-anchor="middle" font-family="' + SERIF + '" font-style="italic" font-weight="700" font-size="12.5" fill="' + A + '">S</text>' +
   '<path d="M7.5 18.4c3 .9 6 .9 9 0" fill="none" stroke="' + A + '" stroke-opacity=".7" stroke-width="1.1" stroke-linecap="round"/>']
];
var grid = document.getElementById('grid');
logos.forEach(function (l) {
  var svg = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + l[2] + '</svg>';
  var card = document.createElement('div'); card.className = 'card';
  card.innerHTML = '<h2></h2><p></p><div class="big">' + svg + '</div><div class="bar">' + svg + '<strong>图层组分批导出</strong><span>复制诊断信息</span></div>';
  card.querySelector('h2').textContent = l[0]; card.querySelector('p').textContent = l[1];
  grid.appendChild(card);
});
</script>
</body>
</html>
